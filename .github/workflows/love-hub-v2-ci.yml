name: Love Hub v2 CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'supabase/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'proxy.ts'
      - 'vercel.json'
      - '.github/workflows/love-hub-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies without mutating package metadata
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build with safe placeholder environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build
