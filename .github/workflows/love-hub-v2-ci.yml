name: Love Hub v2 CI

on:
  pull_request:
    paths:
      - 'love-hub-v2/**'
      - '.github/workflows/love-hub-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: love-hub-v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: love-hub-v2/package.json
      - name: Install dependencies without mutating package metadata
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build with safe placeholder environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build
